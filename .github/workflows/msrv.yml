name: msrv
on:
  # Not on every push: tests run locally before each commit. CI runs on pull requests,
  # weekly, and on demand (Actions tab -> Run workflow) to save Actions minutes.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins stable; the environment variable wins over it (errata P1-I14).
      - run: cargo check --workspace --locked
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
