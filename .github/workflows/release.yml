name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            exe: fairlead
            asset: fairlead-linux-x86_64
          - os: windows-latest
            exe: fairlead.exe
            asset: fairlead-windows-x86_64.exe
          - os: macos-latest
            exe: fairlead
            asset: fairlead-macos
    env:
      # The release is built with the MSRV toolchain (R-REL-006). RUSTUP_TOOLCHAIN overrides
      # rust-toolchain.toml, which pins "stable" (Contract issues I-14).
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Release build, locked (R-REL-046)
        run: cargo build --release --locked -p fairlead
      - name: Stage the binary under its asset name
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.exe }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: GitHub release with BLAKE3 checksums
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fairlead-*
          path: release
          merge-multiple: true
      - name: Install b3sum
        uses: taiki-e/install-action@v2
        with:
          tool: b3sum
      - name: BLAKE3 checksums (R-REL-023, D-50; Contract issues I-8)
        shell: bash
        run: |
          cd release
          b3sum fairlead-* > blake3sums.txt
          cat blake3sums.txt
      - name: Create the release with its assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true

  crates:
    name: publish the crates to crates.io
    # After the GitHub release, so a failed build never reaches crates.io. Needs the repository
    # secret CARGO_REGISTRY_TOKEN (a crates.io API token with the publish-update scope).
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
      - name: The tag names the workspace version
        shell: bash
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="fairlead") | .version')
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but the crates are $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Publish in dependency order (a version already on crates.io is skipped)
        shell: bash
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "secret CARGO_REGISTRY_TOKEN is not set"; exit 1; }
          for c in fairlead-syntax fairlead-core fairlead; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'fairlead-release (github actions)' \
              "https://crates.io/api/v1/crates/$c/$VERSION")
            if [ "$code" = "200" ]; then echo "$c $VERSION is already published; skipped"; continue; fi
            # cargo publish waits until the crate is in the index, so the next one resolves it.
            cargo publish --locked -p "$c"
          done
