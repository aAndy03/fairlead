name: bench

# Weekly and on demand only (E-18).
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release -p fairlead --locked
      - name: Generate the 100,000-file corpus
        run: cargo run -p xtask --locked -- bench-corpus generate --files 100000 --out target/bench/corpus
      # A set-up repository has its sync output committed; without it every check exits 3 (E-46).
      # "warm" is timed after one untimed run that fills the cache. "changed" has one real
      # uncommitted edit. A check may exit 0 or 1 (findings); anything else fails the step.
      - name: Measure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          H=$PWD/target/release/fairlead; C=target/bench/corpus; mkdir -p target/bench
          G() { git -C "$C" -c user.name=bench -c user.email=bench@invalid "$@"; }
          G init -q && G add -A && G commit -qm base
          $H -C "$C" sync --as-of 2026-10-09 >/dev/null
          G add -A && G commit -qm sync
          printf 'pkg-0001/src/f-001.ts\n' > target/bench/files.txt
          t() {
            local s e rc; s=$(date +%s%N); "$@" >/dev/null 2>&1 && rc=0 || rc=$?; e=$(date +%s%N)
            if [ "$rc" -gt 1 ]; then echo "measured command exited $rc: $*" >&2; exit 1; fi
            echo "scale=3; ($e-$s)/1000000000" | bc
          }
          cold=$(t $H -C "$C" check --as-of 2026-10-09 --format terse --no-cache)
          t $H -C "$C" check --as-of 2026-10-09 --format terse >/dev/null
          warm=$(t $H -C "$C" check --as-of 2026-10-09 --format terse)
          echo "// touched" >> "$C/pkg-0000/src/f-000.ts"
          changed=$(t $H -C "$C" check --as-of 2026-10-09 --format terse --changed)
          ff=$(t $H -C "$C" check --as-of 2026-10-09 --format terse --files-from target/bench/files.txt)
          rss=$( { /usr/bin/time -f "%M" $H -C "$C" check --as-of 2026-10-09 --format terse --no-cache >/dev/null 2>/dev/null; } 2>&1 | tail -1 )
          printf 'cold_s = %s\nwarm_s = %s\nchanged_s = %s\nfiles_from_s = %s\npeak_rss_mb = %s\n' "$cold" "$warm" "$changed" "$ff" "$((rss / 1024))" > target/bench/results.toml
          cat target/bench/results.toml
      - name: Measure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = (Resolve-Path "target\release\fairlead.exe").Path; $c = "target\bench\corpus"
          New-Item -ItemType Directory -Force target\bench | Out-Null
          function G { git -C $c -c user.name=bench -c user.email=bench@invalid @args }
          G init -q; G add -A; G commit -qm base
          & $h -C $c sync --as-of 2026-10-09 | Out-Null
          G add -A; G commit -qm sync
          Set-Content target\bench\files.txt "pkg-0001/src/f-001.ts"
          function T([string[]]$a) {
            $s = [Diagnostics.Stopwatch]::StartNew(); & $h @a | Out-Null; $rc = $LASTEXITCODE; $s.Stop()
            if ($rc -gt 1) { throw "measured command exited ${rc}: $a" }
            $s.Elapsed.TotalSeconds
          }
          $base = @('-C', $c, 'check', '--as-of', '2026-10-09', '--format', 'terse')
          $cold = T ($base + '--no-cache')
          T $base | Out-Null
          $warm = T $base
          Add-Content "$c\pkg-0000\src\f-000.ts" "// touched"
          $changed = T ($base + '--changed')
          $ff = T ($base + @('--files-from', 'target\bench\files.txt'))
          # PeakWorkingSet64 reads 0 once the process has exited, so sample it while it runs.
          $p = Start-Process -FilePath $h -ArgumentList ($base + '--no-cache') -NoNewWindow -PassThru -RedirectStandardOutput target\bench\rss.out
          $peak = 0
          while (-not $p.HasExited) { $p.Refresh(); $peak = [math]::Max($peak, $p.PeakWorkingSet64); Start-Sleep -Milliseconds 20 }
          $rss = [math]::Round($peak / 1MB)
          "cold_s = $cold`nwarm_s = $warm`nchanged_s = $changed`nfiles_from_s = $ff`npeak_rss_mb = $rss" | Set-Content -Encoding ascii target\bench\results.toml
          Get-Content target\bench\results.toml
      - name: Gate E6 limits and regression
        run: cargo run -p xtask --locked -- bench-corpus check --results target/bench/results.toml --baseline bench/baseline.toml
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: target/bench/results.toml
          if-no-files-found: ignore

  # 0.2 P7-T5, exit criterion 8 (R-VER-016): 20 seals across 50 scopes on the 100,000-file corpus.
  # Fails unless a one-file change re-reads exactly that file.
  merkle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release -p fairlead --locked
      - name: Corpus with 50 scopes and a 20-seal history
        run: |
          cargo run -p xtask --locked -- bench-corpus generate --files 100000 --out target/bench/merkle
          cargo run -p xtask --locked -- bench-corpus scopes --files 100000 --scopes 50 --corpus target/bench/merkle
          cargo run -p xtask --locked -- bench-corpus history --files 100000 --scopes 50 --seals 20 --corpus target/bench/merkle --bin target/release/fairlead
      - name: Measure
        run: cargo run -p xtask --locked -- bench-corpus merkle --corpus target/bench/merkle --bin target/release/fairlead | tee target/bench/merkle.toml
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-merkle
          path: target/bench/merkle.toml
          if-no-files-found: ignore
