# Cargo workspace of fairlead (contract section 1). A virtual manifest: no package at the root.
[workspace]
members = ["crates/*", "xtask"]
exclude = ["fuzz", "tests/golden", "fixtures"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88" # MSRV floor, R-ARCH-121
license = "GPL-3.0-or-later"   # D-60 (0.1.0 was MIT, D-58)
publish = true        # 0.1 accepted and published (D-59); xtask opts out
repository = "https://github.com/aAndy03/fairlead"
keywords = ["ai-agents", "consistency", "lint", "documentation", "monorepo"]
categories = ["development-tools", "command-line-utilities"]

# Inherited by every member through `[lints] workspace = true` (contract section 1).
[workspace.lints.rust]
unsafe_code = "deny" # fairlead-syntax and fairlead-core upgrade this to forbid in lib.rs

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny" # only the fairlead binary and xtask print, with a reason
print_stderr = "deny"
todo = "deny"         # flipped at the end of P9-T24 (amendment A-67)

[workspace.dependencies]
# Internal path dependencies
fairlead-syntax = { path = "crates/fairlead-syntax", version = "0.2.1" }
fairlead-core = { path = "crates/fairlead-core", version = "0.2.1" }
