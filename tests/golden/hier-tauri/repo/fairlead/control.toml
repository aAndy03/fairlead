[fairlead]
edition = 1
root    = true
scope   = "root"
marker  = "fairlead"

[settings]
folder           = "fairlead"
fairlead-version = "0.2.0"
purpose          = "Notes app: React view, Tauri commands, a sync engine."
owners           = ["@app"]

[layers.app]
view = 30

[layers.core]
engine  = 10
command = 20

[[flow]]
from = "app.view"
to   = ["core.command"]

[kinds.un]
title = "unit"
shape = "code"

[kinds.ctr]
title = "container"
shape = "code"

[kinds.ent]
title = "entry"
shape = "code"

[kinds.brg]
title = "bridge"
shape = "doc"

[hier]
level = 3
