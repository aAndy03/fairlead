[golden]
name = "sparse-checkout"
platforms = ["linux", "windows", "macos"]
needs_git = true
line_endings = "lf"

[[case]]
args = ["check", "--as-of", "2026-10-09", "--format", "terse"]
exit = 5
stdout = "expected/check.terse.txt"
git_status_clean = true
# A real sparse checkout (R-GIT-007): the console scope is absent from the working tree.
git = [
  ["sparse-checkout", "set", "--no-cone", "/*", "!/apps/console/"],
]
