[fairlead]
edition = 1
root    = true
scope   = "root"
marker  = "fairlead"

[settings]
folder        = "fairlead"
fairlead-version = "0.1.0"
purpose       = "sync-stack: Rust engines behind a Tauri shell."
owners        = ["@platform", "@core"]

[kinds.port]
title = "port"
shape = "code"

[kinds.fn]
title = "function"
shape = "code"

[policies]
"rules.*" = "sealed"

[policies.waiver]
budget   = 25
approval = "required"

[rules.primitive-io]
check    = "pattern"
forbid   = "std::(fs|io|net)::"
msg      = "I/O belongs in an adapter (rank 1)"
glob     = ["crates/sync-core/src/**"]
sev      = "error"
stage    = "enforce"
waivable = true
why      = "primitives stay free of I/O"
