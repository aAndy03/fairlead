[fairlead]
edition = 1
root = true
scope = "root"
marker = "fairlead"

[settings]
folder = "fairlead"
fairlead-version = "0.1"
fairlead-range = ">=0.1, <0.2"
# owners = ["@handle"]

[scan]
exclude = [".claude/worktrees/"]

[agents]
targets = ["AGENTS.md", "CLAUDE.md"]

