[package]
name = "ab"
version = "0.1.0"
edition = "2021"
publish = false
description = "The A/B/C evaluation harness (evals/ab/PROTOCOL.md): prepare arms, score sessions, serve the dashboard. Never links fairlead."

[workspace]

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.7", default-features = false, features = ["std", "parse", "serde"] }
