# Independent scorer rules for Relay (evals/ab/PROTOCOL.md, M3 and M4). Read by
# `cargo xtask ab-score`, which never calls fairlead. Never copied into a session.

tests = "node --test \"frontend/tests/**/*.test.ts\" && cargo test --offline -q --manifest-path backend/Cargo.toml"

[[forbid]]
id = "invoke-outside-api"
category = "boundaries"
glob = ["frontend/src/**/*.ts"]
exclude = ["frontend/src/api.ts"]
regex = '\binvoke\('

[[forbid]]
id = "repeated-limit"
category = "constants"
glob = ["frontend/src/**/*.ts", "backend/src/**/*.rs"]
exclude = ["frontend/src/limits.ts", "backend/src/limits.rs"]
regex = '\b(?:80|2000)\b'

# The commands each side knows and the contract lists are the same set.
[[contract]]
id = "commands"
category = "contracts"
# Each entry is one side, a glob: a name counts for a side if any of its files mentions it.
files = ["frontend/src/**/*.ts", "backend/src/**/*.rs", "contract/**/*.md"]
# Every command is `notes.<name>` (spec); a name counts where a file states it: in a quoted
# string, in backticks, as a heading or in a table cell (the notations agents used in the pilot).
# Code that reads a field (`self.notes.insert`) and file names are not command names.
capture = '''(?m)(?:["'`]|^#+\s+|\|\s*)(notes\.[a-z][a-z-]*)\b'''
ignore = ["notes.rs", "notes.ts", "notes.md", "notes.js"]

[owned]
frontend = ["frontend/"]
backend = ["backend/"]
shared = ["contract/", "package.json", "README.md", "AGENTS.md", "CLAUDE.md", ".gitattributes", "CODEOWNERS", "fairlead/", "docs/requests/"]
