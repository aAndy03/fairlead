# Root managerial folder of this repository (R-ARCH-160; decisions D-31 and D-33).
[fairlead]
edition = 1
root    = true
scope   = "root"
marker  = "fairlead"

[settings]
folder        = "fairlead"
fairlead-version = "0.2.0"
purpose       = "fairlead's own declarations: the rules this repository is checked against."
owners        = ["@aAndy03"]

[scan]
exclude = ["target/**", "Cargo.lock", "fixtures/**", "tests/**", "crates/*/tests/**", "fuzz/**", "bench/**", "ablation/**", "evals/**", "docs/plans/**"]

[policies]
"rules.*" = "sealed"

[policies.waiver]
budget   = 25
approval = "required"

[rules.no-clock]
check    = "pattern"
forbid   = '(SystemTime|Instant|Timestamp)::now\('
msg      = "clock reads belong in time.rs or check/options.rs (R-ARCH-090)"
glob     = ["crates/**/*.rs"]
exclude  = ["crates/**/tests/**", "crates/fairlead-core/src/check/options.rs"]
sev      = "error"
stage    = "enforce"
waivable = true
why      = "the product reads the clock once"

[rules.no-net-crates]
check  = "pattern"
forbid = '^(reqwest|ureq|hyper|openssl|rustls|native-tls)\s*='
msg    = "no HTTP or TLS client in 0.1 (R-ARCH-123)"
glob   = ["crates/*/Cargo.toml"]
sev    = "error"
stage  = "enforce"
why    = "the 0.1 binary links no network stack"

# 0.2 dogfood (R-EDN-050, R-REL-025): change docs from the first 0.2 commit; each release seals.
[version]
start = "0.2.0"
integration-branch = "main"

[docs-first]
level = "warn"
# The one tuning of exempt globs (A-2 practice, E2-98): tests, the specification, tooling and CI
# are not user-facing changes; change docs and the changelog describe the product.
exempt = ["Cargo.lock", "docs/**", "tests/**", "xtask/**", ".github/**", "evals/**"]

[changelog]
file = "CHANGELOG.md"
