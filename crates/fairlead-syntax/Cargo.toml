[package]
name = "fairlead-syntax"
description = "Pure directive grammar and extraction for fairlead: no I/O, no git, no threads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
exclude = ["fairlead/"]   # the crate's managerial folder is not shipped (HN-M009, R-PORT-054)
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
unicode-normalization = "0.1.25"
winnow = "1.0.4"

[dev-dependencies]
proptest = "1"
