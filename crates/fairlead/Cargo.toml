[package]
name = "fairlead"
description = "Command-line interface of fairlead: declare, check and brief."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "fairlead"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fairlead-core.workspace = true
fairlead-syntax.workspace = true
camino = "1.2.6"
clap = { version = "4.6.7", features = ["derive", "std", "help", "usage", "error-context"] }
semver = "1.0.28"

[features]
# Owner question Q-1: the synthetic edition 2, selected by FAIRLEAD_TEST_EDITION=2.
test-edition = ["fairlead-core/test-edition"]

[dev-dependencies]
fairlead-core = { workspace = true, features = ["test-edition"] }
tempfile = "3.27.0"
trycmd = "1.2.1"
toml = { version = "1.1.7", default-features = false, features = ["std", "parse", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[test]]
name = "cli"
path = "../../tests/cli.rs"

[[test]]
name = "golden"
path = "../../tests/golden.rs"

[[test]]
name = "trust"
path = "../../tests/trust.rs"

[[test]]
name = "edition_goldens"
path = "../../tests/edition_goldens.rs"

[[test]]
name = "determinism"
path = "../../tests/determinism.rs"

[[test]]
name = "readonly"
path = "../../tests/readonly.rs"

[[test]]
name = "sarif"
path = "../../tests/sarif.rs"

[[test]]
name = "secrets"
path = "../../tests/secrets.rs"

[[test]]
name = "replay"
path = "../../tests/replay.rs"

[[test]]
name = "platform"
path = "../../tests/platform.rs"

[[test]]
name = "codes"
path = "../../tests/codes.rs"

[[test]]
name = "editions"
path = "../../tests/editions.rs"

[[test]]
name = "seal"
path = "../../tests/seal.rs"

[[test]]
name = "upgrade"
path = "../../tests/upgrade.rs"

[[test]]
name = "move"
path = "../../tests/move.rs"
