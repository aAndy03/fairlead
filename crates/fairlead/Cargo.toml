[package]
name = "fairlead"
description = "Command-line interface of fairlead: declare, check and brief."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "fairlead"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fairlead-core.workspace = true
fairlead-syntax.workspace = true
camino = "1.2.6"
clap = { version = "4.6.7", features = ["derive", "std", "help", "usage", "error-context"] }
semver = "1.0.28"

[dev-dependencies]
tempfile = "3.27.0"
trycmd = "1.2.1"
toml = { version = "1.1.7", default-features = false, features = ["std", "parse", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[test]]
name = "cli"
path = "../../tests/cli.rs"

[[test]]
name = "golden"
path = "../../tests/golden.rs"

[[test]]
name = "determinism"
path = "../../tests/determinism.rs"

[[test]]
name = "readonly"
path = "../../tests/readonly.rs"

[[test]]
name = "sarif"
path = "../../tests/sarif.rs"

[[test]]
name = "secrets"
path = "../../tests/secrets.rs"

[[test]]
name = "replay"
path = "../../tests/replay.rs"

[[test]]
name = "platform"
path = "../../tests/platform.rs"

[[test]]
name = "codes"
path = "../../tests/codes.rs"
